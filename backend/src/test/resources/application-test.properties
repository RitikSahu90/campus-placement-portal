spring.datasource.url=jdbc:h2:mem:placement;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
app.jwt-secret=integration_test_secret_at_least_32_bytes_long
app.jwt-ttl=PT24H
