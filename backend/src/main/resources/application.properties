spring.application.name=campus-placement-portal
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:5000}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campus_placement_portal}?connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt-secret=${JWT_SECRET}
app.jwt-ttl=${JWT_TTL:PT1H}
spring.jackson.time-zone=UTC

# Baseline existing installations at version 0, then apply idempotent V1 and subsequent changes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
